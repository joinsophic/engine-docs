name: Update Docs
run-name: >-
  Update docs for
  ${{ github.event.client_payload.render_deploy_id || inputs.render_deploy_id }}

on:
  repository_dispatch:
    types: [production-deployed]
  workflow_dispatch:
    inputs:
      render_deploy_id:
        description: Successful Engine API Render deployment ID
        required: true
        type: string
      force_docs_update:
        description: Run the docs agent even when generated artifacts are unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: production-api-docs-${{ github.event.client_payload.render_deploy_id || inputs.render_deploy_id }}
  cancel-in-progress: false

env:
  RENDER_DEPLOY_ID: ${{ github.event.client_payload.render_deploy_id || inputs.render_deploy_id }}
  FORCE_DOCS_UPDATE: ${{ github.event.client_payload.force_docs_update || inputs.force_docs_update || false }}

jobs:
  validate-deployment:
    name: Validate deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.ENGINE_API_RENDER_SERVICE_ID }}
    outputs:
      backend_current_revision: ${{ steps.deployment.outputs.revision }}
      backend_prev_revision: ${{ steps.previous.outputs.revision }}
      deployed_image: ${{ steps.deployment.outputs.image }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          if [[ ! "$RENDER_DEPLOY_ID" =~ ^dep-[a-z0-9]+$ ]]; then
            echo "::error::render_deploy_id must be a Render deployment ID"
            exit 1
          fi
          if [[ ! "$RENDER_SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]]; then
            echo "::error::Set ENGINE_API_RENDER_SERVICE_ID to the Engine API Render service ID"
            exit 1
          fi
          if [[ -z "$RENDER_API_KEY" ]]; then
            echo "::error::Set the RENDER_API_KEY repository secret"
            exit 1
          fi

      - name: Verify production deployment
        id: deployment
        shell: bash
        env:
          DISPATCHED_IMAGE: ${{ github.event.client_payload.image || '' }}
        run: |
          render_api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          current_deploy="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            "$render_api/$RENDER_DEPLOY_ID")"

          if [[ "$(jq -r '.status' <<< "$current_deploy")" != "live" ]]; then
            echo "::error::Render deployment $RENDER_DEPLOY_ID is not live"
            exit 1
          fi

          extract_revision() {
            jq -r '
              (.commit.id? // "") as $commit
              | (.image.ref? // "") as $image
              | if ($commit | test("^[0-9a-fA-F]{8,40}$")) then
                  $commit
                elif ($image | test(":main-[0-9a-fA-F]{8}(@|$)")) then
                  ($image | capture(":main-(?<sha>[0-9a-fA-F]{8})(?:@|$)").sha)
                else
                  empty
                end
            ' | tr '[:upper:]' '[:lower:]'
          }

          current_revision="$(extract_revision <<< "$current_deploy")"
          if [[ -z "$current_revision" ]]; then
            echo "::error::The Render deployment does not identify a backend Git revision"
            exit 1
          fi

          deployed_image="$(jq -r '.image.ref // empty' <<< "$current_deploy")"
          if [[ -z "$deployed_image" ]]; then
            deployed_image="$DISPATCHED_IMAGE"
          fi
          if [[ -z "$deployed_image" ]]; then
            echo "::error::The Render deployment does not identify a deployed image"
            exit 1
          fi

          echo "revision=${current_revision:0:8}" >> "$GITHUB_OUTPUT"
          echo "image=$deployed_image" >> "$GITHUB_OUTPUT"
          echo "created_at=$(jq -r '.createdAt' <<< "$current_deploy")" >> "$GITHUB_OUTPUT"

      - name: Find previous production deployment
        id: previous
        shell: bash
        env:
          CURRENT_REVISION: ${{ steps.deployment.outputs.revision }}
          CURRENT_CREATED_AT: ${{ steps.deployment.outputs.created_at }}
        run: |
          render_api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          deploy_history="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            "$render_api?limit=100")"

          extract_revision() {
            jq -r '
              (.commit.id? // "") as $commit
              | (.image.ref? // "") as $image
              | if ($commit | test("^[0-9a-fA-F]{8,40}$")) then
                  $commit
                elif ($image | test(":main-[0-9a-fA-F]{8}(@|$)")) then
                  ($image | capture(":main-(?<sha>[0-9a-fA-F]{8})(?:@|$)").sha)
                else
                  empty
                end
            ' | tr '[:upper:]' '[:lower:]'
          }

          previous_revision=""
          while IFS= read -r deploy; do
            candidate_revision="$(extract_revision <<< "$deploy")"
            if [[ -n "$candidate_revision" && "${candidate_revision:0:8}" != "$CURRENT_REVISION" ]]; then
              previous_revision="$candidate_revision"
              break
            fi
          done < <(
            jq -c \
              --arg current_created_at "$CURRENT_CREATED_AT" \
              '.[] | .deploy
                | select(.createdAt < $current_created_at)
                | select(.status == "live" or .status == "deactivated")' \
              <<< "$deploy_history"
          )

          if [[ -z "$previous_revision" ]]; then
            echo "::error::Could not find the preceding successful Render deployment"
            exit 1
          fi

          echo "revision=${previous_revision:0:8}" >> "$GITHUB_OUTPUT"

  detect-changes:
    name: Detect changes
    needs: validate-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      generated_changed: ${{ steps.gate.outputs.generated_changed }}
    steps:
      - name: Check out documentation
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Sync production artifacts
        run: node scripts/sync-metadata.mjs

      - name: Check for changes
        id: gate
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- \
            openapi.json \
            metadata/docs.json \
            snippets/autogen/error-codes.jsx \
            snippets/autogen/webhook-events.jsx)" ]]; then
            generated_changed=true
          else
            generated_changed=false
          fi

          case "${FORCE_DOCS_UPDATE,,}" in
            true|1|yes) force_docs_update=true ;;
            *) force_docs_update=false ;;
          esac

          if [[ "$generated_changed" == true || "$force_docs_update" == true ]]; then
            should_run=true
          else
            should_run=false
            echo "::notice::Generated API artifacts are unchanged; skipping the docs agent"
          fi

          echo "generated_changed=$generated_changed" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  update-docs:
    name: Update Docs
    needs: [validate-deployment, detect-changes]
    if: needs.detect-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKEND_CURRENT_REVISION: ${{ needs.validate-deployment.outputs.backend_current_revision }}
      BACKEND_PREV_REVISION: ${{ needs.validate-deployment.outputs.backend_prev_revision }}
      DEPLOYED_IMAGE: ${{ needs.validate-deployment.outputs.deployed_image }}
    steps:
      - name: Require docs repo write token
        shell: bash
        env:
          DOCS_REPO_WRITE_TOKEN: ${{ secrets.DOCS_REPO_WRITE_TOKEN }}
        run: |
          if [[ -z "$DOCS_REPO_WRITE_TOKEN" ]]; then
            echo "::error::Set the DOCS_REPO_WRITE_TOKEN repository secret"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.DOCS_REPO_WRITE_TOKEN }}

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare branch
        id: branch
        shell: bash
        run: |
          curr="$(printf '%s' "$BACKEND_CURRENT_REVISION" | tr '[:upper:]' '[:lower:]')"
          branch="automation/api-docs-$curr"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            # -C resets the local branch to the remote tip if it already exists.
            git switch -C "$branch" "origin/$branch"
          else
            git switch --create "$branch"
          fi

          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Sync and commit metadata
        id: commit
        shell: bash
        run: |
          node scripts/sync-metadata.mjs

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add \
            openapi.json \
            metadata/docs.json \
            snippets/autogen/error-codes.jsx \
            snippets/autogen/webhook-events.jsx

          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "[docs] Sync production API artifacts"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

          git push --set-upstream origin HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require backend token
        if: needs.detect-changes.outputs.generated_changed == 'false'
        shell: bash
        env:
          BACKEND_REPO_READ_TOKEN: ${{ secrets.BACKEND_REPO_READ_TOKEN }}
        run: |
          if [[ -z "$BACKEND_REPO_READ_TOKEN" ]]; then
            echo "::error::Set the BACKEND_REPO_READ_TOKEN repository secret"
            exit 1
          fi

      - name: Checkout backend
        if: needs.detect-changes.outputs.generated_changed == 'false'
        uses: actions/checkout@v6
        with:
          repository: joinsophic/backend
          token: ${{ secrets.BACKEND_REPO_READ_TOKEN }}
          fetch-depth: 0
          path: .backend
          persist-credentials: false

      - name: Exclude backend checkout
        if: needs.detect-changes.outputs.generated_changed == 'false'
        shell: bash
        run: |
          echo "/.backend/" >> .git/info/exclude

      - name: Generate changelog
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Keep the prompt cache warm across long tool runs (pnpm install/build).
          # Claude Code adds cache_control automatically; 1h TTL avoids 5m expiry misses.
          settings: |
            {
              "env": {
                "ENABLE_PROMPT_CACHING_1H": "1"
              }
            }
          prompt: |
            You are a changelog-only agent for joinsophic/engine-docs. Your only
            content-writing responsibility is updating changelog.mdx, and only when
            the deployed backend range contains a material partner-visible Engine API
            change.

            Inputs:
            - repository: ${{ github.repository }}
            - branch: ${{ steps.branch.outputs.name }}
            - backend_prev_revision: ${{ needs.validate-deployment.outputs.backend_prev_revision }}
            - backend_current_revision: ${{ needs.validate-deployment.outputs.backend_current_revision }}
            - generated_changed: ${{ needs.detect-changes.outputs.generated_changed }}

            Validate before doing anything:
            - repository must equal joinsophic/engine-docs.
            - branch must match automation/api-docs-[0-9a-f]{8}.
            - Both backend revisions must be exactly 8 lowercase hexadecimal characters.
            - The branch must already exist on origin and must be the checked-out branch.

            Use the repository's git-branch, check-backend, write-changelog,
            cross-reference-audit, lint-docs-tone, and git-commit skills. The
            workflow owns pull request creation.

            Never create or switch branches, modify generated artifacts, rebase,
            force-push, or push to main. The only file you may edit is changelog.mdx.
            Never delete or rewrite existing changelog entries. You may append bullets
            to an existing entry for the same release date, or add a new entry at the
            top. Do not remove, shorten, or replace prior entries.

            The `generated_changed` input tells you which investigation path to use:

            Path A (generated_changed is true):
            Production OpenAPI or metadata differs from what is already committed.
            Compare this branch against origin/main for openapi.json and
            metadata/docs.json, then inspect only semantic differences:
            - Added, removed, or changed API operations.
            - Request or response fields, required fields, types, enum values,
              status codes, or security requirements.
            - Added, removed, or changed webhook events or error codes.
            - A changed api_version.

            Ignore formatting, key ordering, OpenAPI descriptions, examples, server
            metadata, and openapi_sha256 by itself.

            If the diff is cosmetic only, stop immediately. Do not inspect the
            backend, edit files, run the build, commit, or push.

            Path B (generated_changed is false):
            The synced artifacts match what is already committed, so OpenAPI alone
            cannot explain why this job ran. Inspect the backend deployment range
            instead. The workflow has checked out joinsophic/backend at .backend.
            Resolve both short revisions to full commits with git -C .backend, then
            run these cheap checks first:
            - git log --oneline backend_prev_revision..backend_current_revision
            - git diff --name-only backend_prev_revision..backend_current_revision

            If the commits and changed paths cannot affect partner-visible API
            behavior, stop immediately. Otherwise inspect only the relevant backend
            diff.

            A changelog entry is necessary only for a material change that partners
            can observe, including:
            - New or removed endpoints, fields, enum values, webhook events, or error codes.
            - Changed authentication, validation, defaults, pagination, sorting,
              rounding, idempotency, retries, side effects, or response semantics.
            - Deprecations or observable bug fixes.

            Do not write entries for internal refactors, infrastructure, tests,
            logging, performance changes without observable behavior,
            documentation-only changes, or generated-file churn.

            Before editing, check whether changelog.mdx already documents the same
            change. If it does, stop without making changes.

            Version tagging is authoritative. You do not decide what is breaking.
            Dated changelog entries are the API version log (breaking changes);
            they are a subset of all partner-visible changes.
            - Confirm a new version only from metadata/docs.json api_version,
              OpenAPI api_version, or a new TIMELINE entry in
              sophic/apps/engine/versions.py for this deployment range.
            - If api_version / TIMELINE changed, write a versioned entry
              (description="<new-version>") and describe migration from that
              version release. Use a **Breaking** section only in that case.
            - If api_version / TIMELINE did not change, use description="additions"
              or description="deprecations". Never invent a YYYY-MM-DD
              description. Never use a **Breaking** section. Do not promote an
              entry to a new version because a change looks breaking under
              versioning.mdx policy.

            Follow the write-changelog skill's format, inclusion rules, and
            voice exactly, while respecting this task's stricter rule that
            changelog.mdx is the only file you may edit. Apply lint-docs-tone
            to the entry. Merge changes into an existing entry for the same
            release date instead of creating a duplicate entry. Keep entries
            concise and partner-focused. Never delete existing entries or
            bullets.

            If and only if a changelog entry is required:
            1. Edit only changelog.mdx. Add or extend content; do not remove anything
               that was already published.
            2. Run corepack enable, pnpm install --frozen-lockfile, pnpm build, and
               pnpm audit-links.
            3. If pnpm audit-links fails, fix every broken link in changelog.mdx
               (use /api-reference/{tag}/{summary-slug}), then re-run until it
               exits 0. Do not commit while audit-links is failing. Follow
               cross-reference-audit.
            4. Review the diff and confirm changelog.mdx is the only changed file
               from your work.
            5. Commit with: [docs] Add API changelog entry
            6. Push the provided branch without force.

            Definition of done: changelog.mdx updated only when required, version
            tag taken only from authoritative signals, pnpm build and
            pnpm audit-links both exit 0, then commit and push. Do not stop
            after writing prose if audit-links still fails.

            Return structured output with:
            - changelog_updated: true only if you committed and pushed changelog.mdx.
            - summary: a short partner-focused summary of what you added, or an empty
              string if no changelog was required.
          claude_args: |
            --model claude-haiku-4-5
            --max-turns 50
            --allowedTools "Read,Edit,Glob,Grep,Bash(git:*),Bash(jq:*),Bash(corepack:*),Bash(pnpm:*)"
            --json-schema '{"type":"object","properties":{"changelog_updated":{"type":"boolean"},"summary":{"type":"string"}},"required":["changelog_updated","summary"],"additionalProperties":false}'
            ${{ needs.detect-changes.outputs.generated_changed == 'false' && '--add-dir .backend' || '' }}

      - name: Verify changelog changes
        id: changelog
        shell: bash
        env:
          ARTIFACT_SHA: ${{ steps.commit.outputs.sha }}
          DOCS_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::error::Claude left uncommitted files in the documentation checkout"
            git status --short
            exit 1
          fi

          git fetch origin "$DOCS_BRANCH"
          changed_files="$(git diff --name-only "$ARTIFACT_SHA..origin/$DOCS_BRANCH")"

          if [[ -z "$changed_files" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$changed_files" == "changelog.mdx" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Claude changed files other than changelog.mdx"
            printf '%s\n' "$changed_files"
            exit 1
          fi

      - name: Open pull request
        id: pull_request
        shell: bash
        env:
          CHANGELOG_CHANGED: ${{ steps.changelog.outputs.changed }}
          DOCS_BRANCH: ${{ steps.branch.outputs.name }}
          GENERATED_CHANGED: ${{ needs.detect-changes.outputs.generated_changed }}
          GH_TOKEN: ${{ secrets.DOCS_REPO_WRITE_TOKEN }}
        run: |
          git fetch origin main "$DOCS_BRANCH"

          if git diff --quiet "origin/main...origin/$DOCS_BRANCH"; then
            echo "::notice::The documentation branch has no changes; no pull request is required"
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          body="$(cat <<EOF
          Synchronizes the API documentation for deployed image \`$DEPLOYED_IMAGE\`.

          - Render deployment: \`$RENDER_DEPLOY_ID\`
          - Backend range: \`$BACKEND_PREV_REVISION..$BACKEND_CURRENT_REVISION\`
          - Generated API artifacts changed: \`$GENERATED_CHANGED\`
          - Changelog updated: \`$CHANGELOG_CHANGED\`
          EOF
          )"
          # Trim the leading indent that YAML forces onto the heredoc body.
          body="$(sed 's/^[[:space:]]*//' <<< "$body")"

          pull_request="$(gh pr list \
            --head "$DOCS_BRANCH" \
            --base main \
            --state open \
            --json url,isDraft \
            --jq '.[0] // {}')"
          pull_request_url="$(jq -r '.url // empty' <<< "$pull_request")"

          if [[ -z "$pull_request_url" ]]; then
            pull_request_url="$(gh pr create \
              --base main \
              --head "$DOCS_BRANCH" \
              --title "Docs update: $DEPLOYED_IMAGE" \
              --body "$body")"
          else
            gh pr edit "$pull_request_url" \
              --title "Docs update: $DEPLOYED_IMAGE" \
              --body "$body"

            if [[ "$(jq -r '.isDraft' <<< "$pull_request")" == "true" ]]; then
              gh pr ready "$pull_request_url"
            fi
          fi

          echo "url=$pull_request_url" >> "$GITHUB_OUTPUT"

      - name: Notify on Slack
        if: steps.changelog.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        env:
          CLAUDE_RESULT: ${{ steps.claude.outputs.structured_output }}
          PULL_REQUEST_URL: ${{ steps.pull_request.outputs.url }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.DOCS_SLACK_CHANNEL_ID }}
        run: |
          # Slack is optional. Never fail the job after the documentation PR exists.
          if [[ -z "$SLACK_BOT_TOKEN" || -z "$SLACK_CHANNEL_ID" ]]; then
            echo "::notice::Skipping Slack notification; SLACK_BOT_TOKEN or DOCS_SLACK_CHANNEL_ID is not set"
            exit 0
          fi

          summary="$(jq -r '.summary // empty' <<< "$CLAUDE_RESULT")"
          if [[ -z "$summary" ]]; then
            summary="Added an API changelog entry for $BACKEND_PREV_REVISION..$BACKEND_CURRENT_REVISION."
          fi

          payload="$(jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg text "$summary <$PULL_REQUEST_URL|Review the documentation update>." \
            '{channel: $channel, text: $text}')"
          response="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $SLACK_BOT_TOKEN" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data "$payload" \
            "https://slack.com/api/chat.postMessage")"

          if [[ "$(jq -r '.ok' <<< "$response")" != "true" ]]; then
            echo "::warning::Slack notification failed: $(jq -r '.error // "unknown_error"' <<< "$response")"
            exit 0
          fi
