name: Update Docs

on:
  repository_dispatch:
    types: [production-deployed]
  workflow_dispatch:
    inputs:
      render_deploy_id:
        description: Successful Engine API Render deployment ID
        required: true
        type: string
      force_docs_update:
        description: Run the docs agent even when generated artifacts are unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: production-api-docs-${{ github.event.client_payload.render_deploy_id || inputs.render_deploy_id }}
  cancel-in-progress: false

env:
  RENDER_DEPLOY_ID: ${{ github.event.client_payload.render_deploy_id || inputs.render_deploy_id }}
  FORCE_DOCS_UPDATE: ${{ github.event.client_payload.force_docs_update || inputs.force_docs_update || false }}

jobs:
  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.ENGINE_API_RENDER_SERVICE_ID }}
      CURSOR_AUTOMATION_WEBHOOK_URL: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_URL }}
      CURSOR_AUTOMATION_KEY: ${{ secrets.CURSOR_AUTOMATION_KEY }}
    outputs:
      backend_current_revision: ${{ steps.deployment.outputs.revision }}
      backend_prev_revision: ${{ steps.previous.outputs.revision }}
    steps:
      - name: Validate Inputs
        shell: bash
        run: |
          if [[ ! "$RENDER_DEPLOY_ID" =~ ^dep-[a-z0-9]+$ ]]; then
            echo "::error::render_deploy_id must be a Render deployment ID"
            exit 1
          fi
          if [[ ! "$RENDER_SERVICE_ID" =~ ^srv-[a-z0-9]+$ ]]; then
            echo "::error::Set ENGINE_API_RENDER_SERVICE_ID to the Engine API Render service ID"
            exit 1
          fi
          if [[ -z "$RENDER_API_KEY" ]]; then
            echo "::error::Set the RENDER_API_KEY repository secret"
            exit 1
          fi
          if [[ -z "$CURSOR_AUTOMATION_WEBHOOK_URL" ]]; then
            echo "::error::Set the CURSOR_AUTOMATION_WEBHOOK_URL repository secret"
            exit 1
          fi
          if [[ -z "$CURSOR_AUTOMATION_KEY" ]]; then
            echo "::error::Set the CURSOR_AUTOMATION_KEY repository secret"
            exit 1
          fi

      - name: Verify Production Deployment
        id: deployment
        shell: bash
        run: |
          render_api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          current_deploy="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            "$render_api/$RENDER_DEPLOY_ID")"

          if [[ "$(jq -r '.status' <<< "$current_deploy")" != "live" ]]; then
            echo "::error::Render deployment $RENDER_DEPLOY_ID is not live"
            exit 1
          fi

          extract_revision() {
            jq -r '
              (.commit.id? // "") as $commit
              | (.image.ref? // "") as $image
              | if ($commit | test("^[0-9a-fA-F]{8,40}$")) then
                  $commit
                elif ($image | test(":main-[0-9a-fA-F]{8}(@|$)")) then
                  ($image | capture(":main-(?<sha>[0-9a-fA-F]{8})(?:@|$)").sha)
                else
                  empty
                end
            ' | tr '[:upper:]' '[:lower:]'
          }

          current_revision="$(extract_revision <<< "$current_deploy")"
          if [[ -z "$current_revision" ]]; then
            echo "::error::The Render deployment does not identify a backend Git revision"
            exit 1
          fi

          echo "revision=${current_revision:0:8}" >> "$GITHUB_OUTPUT"
          echo "created_at=$(jq -r '.createdAt' <<< "$current_deploy")" >> "$GITHUB_OUTPUT"

      - name: Find Previous Production Deployment
        id: previous
        shell: bash
        env:
          CURRENT_REVISION: ${{ steps.deployment.outputs.revision }}
          CURRENT_CREATED_AT: ${{ steps.deployment.outputs.created_at }}
        run: |
          render_api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          deploy_history="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            "$render_api?limit=100")"

          extract_revision() {
            jq -r '
              (.commit.id? // "") as $commit
              | (.image.ref? // "") as $image
              | if ($commit | test("^[0-9a-fA-F]{8,40}$")) then
                  $commit
                elif ($image | test(":main-[0-9a-fA-F]{8}(@|$)")) then
                  ($image | capture(":main-(?<sha>[0-9a-fA-F]{8})(?:@|$)").sha)
                else
                  empty
                end
            ' | tr '[:upper:]' '[:lower:]'
          }

          previous_revision=""
          while IFS= read -r deploy; do
            candidate_revision="$(extract_revision <<< "$deploy")"
            if [[ -n "$candidate_revision" && "${candidate_revision:0:8}" != "$CURRENT_REVISION" ]]; then
              previous_revision="$candidate_revision"
              break
            fi
          done < <(
            jq -c \
              --arg current_created_at "$CURRENT_CREATED_AT" \
              '.[] | .deploy
                | select(.createdAt < $current_created_at)
                | select(.status == "live" or .status == "deactivated")' \
              <<< "$deploy_history"
          )

          if [[ -z "$previous_revision" ]]; then
            echo "::error::Could not find the preceding successful Render deployment"
            exit 1
          fi

          echo "revision=${previous_revision:0:8}" >> "$GITHUB_OUTPUT"

  detect-changes:
    name: Detect Changes
    needs: validate-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      generated_changed: ${{ steps.gate.outputs.generated_changed }}
    steps:
      - name: Check Out Documentation
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Production Artifacts
        run: node scripts/sync-api-artifacts.mjs

      - name: Check for Documentation Changes
        id: gate
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- \
            openapi.json \
            metadata/docs.json \
            snippets/autogen/error-codes.jsx \
            snippets/autogen/webhook-events.jsx)" ]]; then
            generated_changed=true
          else
            generated_changed=false
          fi

          case "${FORCE_DOCS_UPDATE,,}" in
            true|1|yes) force_docs_update=true ;;
            *) force_docs_update=false ;;
          esac

          if [[ "$generated_changed" == true || "$force_docs_update" == true ]]; then
            should_run=true
          else
            should_run=false
            echo "::notice::Generated API artifacts are unchanged; skipping the docs agent"
          fi

          echo "generated_changed=$generated_changed" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  update-docs:
    name: Update Docs
    needs: [validate-deployment, detect-changes]
    if: needs.detect-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND_CURRENT_REVISION: ${{ needs.validate-deployment.outputs.backend_current_revision }}
      BACKEND_PREV_REVISION: ${{ needs.validate-deployment.outputs.backend_prev_revision }}
      CURSOR_AUTOMATION_WEBHOOK_URL: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_URL }}
      CURSOR_AUTOMATION_KEY: ${{ secrets.CURSOR_AUTOMATION_KEY }}
    steps:
      - name: Check Out Documentation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare Update Branch
        id: branch
        shell: bash
        run: |
          curr="$(printf '%s' "$BACKEND_CURRENT_REVISION" | tr '[:upper:]' '[:lower:]')"
          branch="automation/api-docs-$curr"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch --create "$branch" --track "origin/$branch"
          else
            git switch --create "$branch"
          fi

          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Update Documentation
        run: node scripts/sync-api-artifacts.mjs

      - name: Commit Documentation Changes
        id: commit
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add \
            openapi.json \
            metadata/docs.json \
            snippets/autogen/error-codes.jsx \
            snippets/autogen/webhook-events.jsx

          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "[docs] Sync production API artifacts"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

          git push --set-upstream origin HEAD

      - name: Open Documentation Pull Request
        if: needs.detect-changes.outputs.generated_changed == 'true'
        id: pull_request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          pull_request_url="$(gh pr list \
            --head "$DOCS_BRANCH" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url')"

          if [[ -z "$pull_request_url" ]]; then
            pull_request_url="$(gh pr create \
              --base main \
              --head "$DOCS_BRANCH" \
              --title "[docs] Update production API documentation" \
              --body "Synchronizes the committed API artifacts for Render deployment \`$RENDER_DEPLOY_ID\` (backend revision \`$BACKEND_CURRENT_REVISION\`).")"
          fi

          echo "url=$pull_request_url" >> "$GITHUB_OUTPUT"

      - name: Trigger Changelog Automation
        shell: bash
        env:
          DOCS_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          jq -n \
            --arg backend_prev_revision "$(printf '%s' "$BACKEND_PREV_REVISION" | tr '[:upper:]' '[:lower:]')" \
            --arg backend_current_revision "$(printf '%s' "$BACKEND_CURRENT_REVISION" | tr '[:upper:]' '[:lower:]')" \
            --arg backend_compare_url "https://github.com/joinsophic/backend/compare/$BACKEND_PREV_REVISION...$BACKEND_CURRENT_REVISION" \
            --arg render_deploy_id "$RENDER_DEPLOY_ID" \
            --arg branch "$DOCS_BRANCH" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pull_request_url "${{ steps.pull_request.outputs.url }}" \
            '{
              backend_prev_revision: $backend_prev_revision,
              backend_current_revision: $backend_current_revision,
              backend_compare_url: $backend_compare_url,
              render_deploy_id: $render_deploy_id,
              branch: $branch,
              repository: $repository,
              pull_request_url: $pull_request_url
            }' > "$RUNNER_TEMP/cursor-payload.json"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $CURSOR_AUTOMATION_KEY" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/cursor-payload.json" \
            "$CURSOR_AUTOMATION_WEBHOOK_URL"
